{% extends 'catalog_base.html' %}

{% block content %}

<div class="container mt-1">
    <h2>Удалить запись</h2>
    <p>Вы уверены, что хотите удалить "{{ product.name }}"?</p>

    <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'catalog:product' pk=product.pk %}" class="btn btn-secondary">Отмена</a>
    </form>

</div>

{% endblock %}
