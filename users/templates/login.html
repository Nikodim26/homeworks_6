<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пользователь</title>
    <link rel="icon" href="{% static 'icons/skypro.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
        {% if page_title %}
            <h5 class="my-0 mr-md-auto font-weight-normal">{{page_title}}</h5>
        {% else %}
            <h5 class="my-0 mr-md-auto font-weight-normal">Вход</h5>
        {% endif %}
    </div>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        {% if page_title %}
            <button type="submit" class="btn btn-primary">{{page_title}}</button>
        {% else %}
            <button type="submit" class="btn btn-primary">Войти</button>
        {% endif %}
    </form>
</div>

</body>
</html>
