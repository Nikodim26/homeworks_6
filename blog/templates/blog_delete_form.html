{% extends 'blog_base.html' %}

{% block content %}
<h2>Удалить запись</h2>
<p>Вы уверены, что хотите удалить "{{ entry.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="/entry/{{ entry.pk }}/" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
