{% extends 'catalog_base.html' %}

{% block content %}
<div class="container mt-5">
    <h5 class="pricing-header pb-md-5 mx-auto text-center">Добро пожаловать!</h5>

    <form method="post" enctype="multipart/form-data" class="w-100" style="max-width: 400px; margin: 0 auto;">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="d-flex justify-content-center gap-2 mt-3">
            {% if request.path == '/register/' %}
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            {% else %}
                <button type="submit" class="btn btn-primary">Войти</button>
                <a class="btn btn-primary" href="{% url 'users:register'%}">Регистрация</a>
            {% endif %}
        </div>
    </form>
</div>

{% endblock %}
