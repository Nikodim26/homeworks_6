{% extends 'catalog_base.html' %}
{% load catalog_tags %}
{% block content %}

<div class="container text-left">
    <h2>Программный продукт</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>

        {% if product.pk %}
            <a href="/product/{{ product.pk }}/" class="btn btn-secondary">Отмена</a>
        {% else %}
            <a href="/catalogue/" class="btn btn-secondary">Отмена</a>
        {% endif %}

    </form>
</div>

{% endblock %}
