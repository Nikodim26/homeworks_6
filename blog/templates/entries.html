{% extends 'blog_base.html' %}
{% load my_tags %}

{% block content %}

<div class="container">
    <h2 class="text-info mb-4 text-center">Записи блога</h2>
    <div class="row g-5">

        {% for entry in entries %}
        <div class="col-lg-3 text-center">
            <h6 class="text-dark mb-1">{{entry.name}}</h6>
            <div class="mb-3">
                <img src="{{ entry.preview | media_filter }}" alt="Превью (изображение)"
                     class="rounded img-with-border" width="320" height="200">
            </div>

            <p class="text-justify" style="max-width: 350px; margin: 0 auto;"> {{entry.content | truncatechars:60}}</p>
            <a href="/entry/{{entry.pk}}/" class="btn btn-outline-primary rounded-sm"
               style="margin-top: 20px;">Подробности</a>
        </div>
        {% endfor %}

    </div>
</div>
{% endblock %}
